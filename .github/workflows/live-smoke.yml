name: Live storefront smoke (read-only)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/live-smoke.yml

permissions:
  contents: read

jobs:
  verify-public-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check public storefront and commerce reads without modifying data
        shell: bash
        env:
          HOST: https://smart-tijori.onrender.com
        run: |
          set -euo pipefail
          failures=0
          for path in "/" "/stores" "/api/stores" "/api/products?storeId=blr-01"; do
            echo "::group::GET $path"
            code="$(curl --silent --show-error --location \
              --retry 2 --retry-delay 5 --connect-timeout 15 --max-time 55 \
              --output /dev/null --write-out '%{http_code}' "$HOST$path")" || code="000"
            echo "HTTP $code"
            if [[ "$code" != "200" ]]; then
              echo "::error::GET $path returned HTTP $code, expected 200"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done
          if (( failures > 0 )); then
            echo "::error::$failures public route(s) failed; deployment is not end-to-end verified"
            exit 1
          fi
          echo "Four read-only routes returned HTTP 200."
