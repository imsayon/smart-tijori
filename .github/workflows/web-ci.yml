name: Web Module CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CKJS_LINKING: dynamic
  GNUMAKEFLAGS: "-l4"

jobs:
  web-checks:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Existing service unit tests
        run: pnpm test:services

      - name: India demo data integrity checks
        run: pnpm test:india-demo

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Run Unit Tests
        run: pnpm test:unit

      - name: Run HTTP Handler Tests
        run: pnpm test:http

      - name: Run Security Tests (CSRF, Sessions, Bounds)
        run: pnpm test:security

      - name: Run Browser & Accessibility Tests
        run: pnpm test:browser

      - name: ESLint
        run: pnpm lint

      - name: Web Application Production Build
        run: pnpm build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_DEMO_MODE: 'false'
          SESSION_SECRET: 'ci-build-test-secret-min-32-characters-long'
