name: Discovery integration checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/discovery-search-and-indexing]

permissions:
  contents: write

jobs:
  discovery-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: pnpm
      - name: Synchronize pnpm 12 lockfile on dedicated branch
        if: github.event_name == 'push' && github.ref_name == 'feat/discovery-search-and-indexing'
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          git config user.name "smart-tijori-integration"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(discovery): normalize pnpm 12 lockfile"
            git push origin HEAD:feat/discovery-search-and-indexing
          fi
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Static TypeScript checks
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Existing service unit tests
        run: pnpm test:services
      - name: Discovery DTO and fixture tests
        run: pnpm test:contracts
